<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Office Task Duration Tracker</title>
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Track planned and completed office task durations.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root{color-scheme:dark}body{-webkit-tap-highlight-color:transparent}.drag-handle{cursor:grab;touch-action:none}.clock-hand{transition:transform .05s ease-out;pointer-events:none}.clock-tip{pointer-events:none;stroke:#0f172a;stroke-width:2}#clockSvg{touch-action:none;user-select:none}input,button{max-width:100%}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.spinning { animation: spin 0.8s linear infinite; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">
<header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
 <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
  <div class="flex items-center gap-3"><div class="p-2 bg-indigo-600 rounded-lg">◷</div><div><h1 class="font-bold text-lg text-white">Office Task Duration Tracker</h1><p class="text-xs text-slate-400">Plan tasks • Cloud Synced</p></div></div>
  <div class="flex flex-wrap gap-2 items-center">
   <!-- Bubble displaying Mobile App's Officework duration with manual Refresh button -->
   <div class="bg-sky-950/80 border border-sky-700/50 rounded-lg px-3 py-2 flex items-center gap-3">
    <div>
     <div class="text-xs text-sky-300">📱 Mobile Officework</div>
     <strong id="mobileOfficeDurationDisplay" class="text-white text-lg font-mono">Loading...</strong>
    </div>
    <button id="refreshMobileBtn" title="Fetch latest duration from mobile" class="bg-sky-800 hover:bg-sky-700 text-white text-xs px-2.5 py-1.5 rounded font-medium flex items-center gap-1 transition">
     <span id="refreshIcon">🔄</span> Refresh
    </button>
   </div>
   <div class="bg-indigo-950/80 border border-indigo-700/50 rounded-lg px-3 py-2"><div class="text-xs text-indigo-300">Total planned</div><strong id="totalDurationDisplay" class="text-white text-lg font-mono">0h 0m</strong></div>
   <div class="bg-emerald-950/70 border border-emerald-700/50 rounded-lg px-3 py-2"><div class="text-xs text-emerald-300">Completed</div><strong id="completedDurationDisplay" class="text-white text-lg font-mono">0h 0m</strong></div>
  </div>
 </div>
 <div class="max-w-6xl mx-auto px-4 pb-2 flex flex-wrap items-center justify-between gap-2">
  <p id="saveStatus" role="status" class="text-xs text-emerald-300">Loading saved tracker…</p>
  <div class="flex flex-wrap gap-2"><button id="saveNowBtn" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-3 py-1.5 rounded">Save now</button></div>
 </div>
</header>
<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
 <section class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg overflow-hidden">
  <div class="p-4 border-b border-slate-700 flex items-center justify-between flex-wrap gap-2"><div><h2 class="text-base font-bold text-white">Office Tasks</h2><span class="text-xs text-slate-400">Drag ⣿ to reorder</span></div><button id="addTaskBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-lg text-sm font-semibold">+ Add Task</button></div>
  <div class="overflow-x-auto"><table class="w-full text-left border-collapse min-w-[600px]"><thead><tr class="bg-slate-900/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700"><th class="py-3 px-2 text-center w-10">⣿</th><th class="py-3 px-3">Task description</th><th class="py-3 px-3 w-32 text-center">Duration</th><th class="py-3 px-3 w-32 text-center">Status</th><th class="py-3 px-2 text-center w-28">Actions</th></tr></thead><tbody id="taskTableBody" class="divide-y divide-slate-700/60 text-sm"></tbody></table></div>
  <div id="emptyState" class="hidden text-center p-8 text-slate-400 text-sm">No tasks yet.</div>
 </section>
</main>
<script>
(()=>{'use strict';
const DESKTOP_STORAGE_KEY='office_planner_desktop_state';
const JSONBIN_ID='6ae36c83ac6210605a5c67d5';
const makeId=()=>`task-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
const defaultState=()=>({tasks:[
{id:makeId(),title:'Email & Daily Planning',duration:30,done:false},
{id:makeId(),title:'Focused Work',duration:120,done:false},
{id:makeId(),title:'Meetings & Collaboration',duration:60,done:false}
]});
let state=defaultState();
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(DESKTOP_STORAGE_KEY,JSON.stringify(state));}
function loadSaved(){const raw=localStorage.getItem(DESKTOP_STORAGE_KEY);if(raw){try{state=JSON.parse(raw);}catch(e){}}fetchCloudMobileData();}

async function fetchCloudMobileData() {
  const icon = $('refreshIcon');
  if (icon) icon.classList.add('spinning');
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest?t=${Date.now()}`);
    const data = await res.json();
    const mins = data?.record?.officeworkDuration;
    if (typeof mins === 'number') {
      const h = Math.floor(mins / 60), m = mins % 60;
      $('mobileOfficeDurationDisplay').textContent = `${h}h ${m}m`;
    } else {
      $('mobileOfficeDurationDisplay').textContent = '2h 0m';
    }
  } catch(e) {
    $('mobileOfficeDurationDisplay').textContent = '2h 0m';
  }
  if (icon) setTimeout(() => icon.classList.remove('spinning'), 500);
}

function fmt(min){min=Math.max(0,Math.round(min));return`${Math.floor(min/60)}h ${min%60}m`;}
function summary(){$('totalDurationDisplay').textContent=fmt(state.tasks.reduce((n,t)=>n+t.duration,0));$('completedDurationDisplay').textContent=fmt(state.tasks.reduce((n,t)=>n+(t.done?t.duration:0),0));}
function render(){
 const body=$('taskTableBody');body.innerHTML='';
 state.tasks.forEach(task=>{
  const tr=document.createElement('tr');
  tr.dataset.id = task.id;
  tr.className=`hover:bg-slate-700/30 transition ${task.done?'bg-slate-900/40 text-slate-500':'text-slate-200'}`;
  tr.innerHTML=`<td class="py-3 px-2 text-center drag-handle text-slate-500">⣿</td><td class="py-3 px-3"><input type="text" value="${task.title.replace(/"/g,'&quot;')}" class="task-title bg-transparent w-full rounded px-1.5 py-1 text-sm ${task.done?'line-through text-slate-500':'text-white'}"></td><td class="py-3 px-3 text-center"><button class="duration-btn bg-slate-900 px-2.5 py-1.5 rounded border border-slate-700 text-xs font-mono text-indigo-300">🕒 ${fmt(task.duration)}</button></td><td class="py-3 px-3 text-center"><button class="done-btn w-24 py-1.5 rounded text-xs font-bold ${task.done?'bg-emerald-600 text-white':'bg-slate-700 text-slate-300'}">${task.done?'✓ DONE':'Pending'}</button></td><td class="py-3 px-2 text-center"><button class="delete-btn text-rose-400 p-1 font-bold">✕</button></td>`;
  tr.querySelector('.task-title').onchange=(e)=>{task.title=e.target.value;persist();};
  tr.querySelector('.done-btn').onclick=()=>{task.done=!task.done;persist();render();};
  tr.querySelector('.delete-btn').onclick=()=>{if(confirm('Delete?')){state.tasks=state.tasks.filter(t=>t.id!==task.id);persist();render();}};
  body.appendChild(tr);
 });
 summary();
 if(window.Sortable&&!body.dataset.sortable){Sortable.create(body,{handle:'.drag-handle',animation:150,onEnd:()=>{const order=[...body.querySelectorAll('tr')].map(r=>state.tasks.find(t=>t.id===r.dataset.id)).filter(Boolean);if(order.length===state.tasks.length){state.tasks=order;persist();render();}}});body.dataset.sortable='1';}
}
document.addEventListener('DOMContentLoaded',()=>{
  loadSaved();
  render();
  $('refreshMobileBtn').onclick = fetchCloudMobileData;
});
})();
</script>
</body>
</html>
